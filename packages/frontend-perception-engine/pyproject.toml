# frontend-perception-engine — legacy install name (thin reverse alias).
#
# Prefer:  pip install frontend-mcp
# This package only depends on frontend-mcp==THIS_VERSION so old docs/commands keep working.

[project]
name = "frontend-perception-engine"
version = "1.2.0"
description = "Legacy alias for frontend-mcp (same version pin — no skew)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "frontend-mcp==1.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
