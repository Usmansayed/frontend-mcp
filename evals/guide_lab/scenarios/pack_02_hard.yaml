# Guide Lab HARD pack — adversarial / conflicting signals (EXP-026)
# Designed to stress tunnel vision, class traps, and claim-done mistakes.

- id: H01
  class: mockup
  ask: "Match this Figma-like screenshot; gate screams inspiration"
  unpaid: [inspiration, snapshot, component, observe, verify]
  gate: {state: blocked, next_required_capability: inspiration_workflow}
  backlog_top: inspiration
  recommended_evidence: inspiration_workflow
  gold:
    owed: [snapshot, observe, verify]
    owed_or: [[snapshot, observe, component], [snapshot, observe, verify]]
    owed_mode: covers
    first_family: snapshot
    must_not: [inspiration]
    require_multi_owed: true

