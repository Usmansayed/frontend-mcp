# Guide Lab scenarios — isolated decision quizzes (EXP-026)
# Gold = what a well-guided agent should choose. Policies A/B scored offline.

- id: Q01
  class: greenfield
  ask: "Build a new professional SaaS landing page from scratch"
  unpaid: [inspiration, snapshot, component]
  gate: {state: blocked, next_required_capability: inspiration_workflow}
  backlog_top: inspiration
  gold:
    owed: [inspiration, component]
    owed_or: [[snapshot, component], [inspiration, component, observe]]
    owed_mode: covers
    first_family: inspiration
    first_family_or: [snapshot, inspiration]
    first_mode: reference_family
    must_not: [seo]
    require_multi_owed: true

